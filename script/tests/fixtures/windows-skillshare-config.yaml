# yaml-language-server: $schema=https://raw.githubusercontent.com/runkids/skillshare/main/schemas/config.schema.json

sources:
  mcp: ~\AppData\Roaming\skillshare\mcp.yaml
  skills: ~\AppData\Roaming\skillshare\skills

git_root: root

targets:
  claude:
    skills:
      path: ~\.claude\skills
    agents:
      path: ~\.claude\agents
  codex:
    skills:
      path: ~\.agents\skills
  opencode:
    skills:
      path: ~\.config\opencode\skills
      enabled: false

extras:
  - name: agents-md
    file: AGENTS.md
    targets:
      - path: ~\.claude
        as: CLAUDE.md
      - path: ~\.codex
      - path: ~\.config\opencode
  - name: agent-commit
    file: instructions.md
    targets:
      - path: ~\.config\agent-commit
  - name: pstack-models
    file: pstack-models.md
    targets:
      - path: ~\.claude\rules
  - name: opencode-commit
    file: commit-instructions.md
    targets:
      - path: ~\.config\opencode

preserve_tilde_on_save: true
