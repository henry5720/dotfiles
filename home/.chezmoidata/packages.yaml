# 系統套件清單,run_onchange_before_install-packages.sh.tmpl 會讀它。
# 依平台分開列,這份本身就是對照表(同一個工具在兩邊名字不同就各寫各的)。
# 加套件只改這裡;改了之後下一次 chezmoi apply 只會裝缺的那幾個。
packages:
  # 基底:只放 chezmoi 自己要的。git 給 git-repo external,curl 給各安裝腳本,
  # jq、python3 給 home/ 的 modify_ 與 run_ 腳本(jq 改 JSON、python3 改 TOML、解 zip)。
  # WSL／雲端主機本來就有,但 proot Ubuntu 和最小化映像沒有,沒裝 apply 會在半路失敗。
  # 其他東西(zsh、vim、eza…)都是選裝工具,放下面的 toolPackages 或各自的安裝腳本。
  # Ubuntu(WSL、雲端主機、proot Ubuntu),apt 的套件名
  ubuntu:
    - git
    - curl
    - jq
    - python3
  # 原生 Termux,pkg 的套件名。python 套件提供 python3 指令;openssh 給 sshd 與 authorized_keys。
  termux:
    - git
    - curl
    - openssh
    - jq
    - python
  # macOS,brew 的 formula 名(run_onchange_before_install-packages-darwin 交給 brew bundle)。
  # git、python3 由 Homebrew 前置的 Xcode Command Line Tools 提供,curl 系統內建,只缺 jq
  # (macOS 15 起系統也有 /usr/bin/jq,舊版沒有)。brews 是 formula、casks 是 app,
  # 照 chezmoi 官方 brew bundle 範例的結構;Homebrew 本身不由 chezmoi 裝(見 Runbook)。
  darwin:
    brews:
      - jq
    casks: []

# 選裝工具(.chezmoi.toml.tmpl 的 tools 選單)裡直接走 apt／pkg／brew 的:工具名 → 套件。
# 有勾才裝,跟上面的清單一起由同一支套件腳本處理(macOS 是 install-packages-darwin)。
# 要加 apt 來源、curl installer 的工具不放這裡,各自一支 run_onchange_after_install-<工具>.sh.tmpl。
toolPackages:
  ubuntu:
    zsh:
      - zsh
    vim:
      - vim
    # Claude Code 本體是 native installer(run_onchange_after_install-claude);
    # 它的 Read tool 讀 PDF 時固定呼叫 pdftoppm,沒裝會直接報錯,不會退回 mutool
    claude:
      - poppler-utils
    # 影音轉檔、抽音軌與影格
    ffmpeg:
      - ffmpeg
    # headless Chrome 本體是 .deb(run_onchange_after_install-headless-chrome);
    # 沒這兩個字型,中文和 emoji 截圖全是方框
    headless-chrome:
      - fonts-noto-cjk
      - fonts-noto-color-emoji
  # 原生 Termux:termux-packages 主 repo 有的都走 pkg(Linux 上 eza、fzf 這些由 mise 裝,見下面 miseTools)。
  # 主 repo 沒有、或官方 installer 沒在 Termux 驗過的(btop、tailscale、code-server、coding agent…)
  # 在 .chezmoitemplates/tool-env 標裝不了,不列。Node 不在這裡:見下面 nodePackages.termux。
  termux:
    zsh:
      - zsh
    starship:
      - starship
    vim:
      - vim
    eza:
      - eza
    fzf:
      - fzf
    bat:
      - bat
    ripgrep:
      - ripgrep
    fastfetch:
      - fastfetch
    gh:
      - gh
    ffmpeg:
      - ffmpeg
    ttyd:
      - ttyd
    cloudflared:
      - cloudflared
  # macOS 全部走 brew(一樣是 formula 名)。zsh、vim 系統內建,不列;Node 由 nvm 裝(見下面 nodeTools),
  # mac 不缺 libatomic。tailscale、headless-chrome、playwright-cli 在 mac 裝不了(.chezmoitemplates/tool-env)。
  # herdr、claude、codex、opencode、agent-config 照原本的官方 installer(各自的 run_ 腳本),不列。
  # wakatime-cli 也不走 brew:WakaTime plugin 找 ~/.wakatime 底下官方位置那支(install-wakatime)。
  darwin:
    starship:
      - starship
    eza:
      - eza
    fzf:
      - fzf
    bat:
      - bat
    ripgrep:
      - ripgrep
    fastfetch:
      - fastfetch
    btop:
      - btop
    gh:
      - gh
    code-server:
      - code-server
    ttyd:
      - ttyd
    claude:
      - poppler
    ffmpeg:
      - ffmpeg

# 要 Node 的選裝工具:勾了其中一個,就由 nvm 裝 Node LTS(run_onchange_after_install-node)。
# 選單上的 node 本身就是「只要 Node」;其他幾項沒勾 node 也會自動裝,免得漏勾讓 apply 半路失敗。
# 判斷在 .chezmoitemplates/needs-node。
#   node:選單上的 nvm＋Node LTS
#   codegraph、playwright-cli:npm 全域套件
#   opencode:oh-my-opencode-slim 用 npx 跑(dot_config/opencode/oh-my-opencode-slim.json)
#   wakatime:Claude Code、Codex 的 WakaTime plugin 用 node 跑 hook
nodeTools:
  - node
  - codegraph
  - playwright-cli
  - opencode
  - wakatime
# 勾了 nodeTools 其中一個時一起裝的系統套件(macOS 不用)。
# ubuntu:nvm 裝的 Node 官方 binary 要 libatomic.so.1。以前 build-essential(gcc)順帶裝了,
#   基底拿掉它之後要自己列,不然 node 一執行就 exit 127
# termux:Node 本身。nvm 的 Node 官方 binary 在 Android 跑不起來,改用 pkg 的 LTS 版、不跑 install-node。
#   nodejs-lts 跟 nodejs、nodejs-current 互斥:已經有 node 指令(裝了其中一個)就不裝,見套件腳本
nodePackages:
  ubuntu:
    - libatomic1
  termux:
    - nodejs-lts

# Linux 由 mise 裝到家目錄的選裝工具(Termux 走 pkg、macOS 走 brew,不看這裡):
# 工具名 → mise 的工具名(tool)與裝完的指令名(cmd)。分兩種,看 mise 用什麼 backend 裝(#233):
#   always: true —— GitHub release 的單一執行檔(aqua／github backend):不分有沒有 root 都用 mise,
#                   也不看系統有沒有同名指令(Ubuntu 24.04 的 apt 有的太舊,例如 fzf 0.44 沒有 `fzf --zsh`)。
#   其他 ——————————— 只有 apt 用不了(沒有 root,或非 Debian 系;.chezmoitemplates/use-mise)才用 mise,
#                   而且系統已經有 cmd 的不裝。conda 那幾個有 root 時照 apt(toolPackages.ubuntu):
#                   conda 會把整套函式庫裝進家目錄,apt 還有 unattended-upgrades 補安全更新。
#                   有官方裝法的(gh 的官方 apt 源、code-server 的 .deb)也是這種:有 root 時走它自己的腳本。
# 清單在 .chezmoitemplates/mise-tools;部署成 ~/.config/mise/conf.d/dotfiles.toml,
# run_onchange_after_install-mise 跑 mise install。
# tool 寫 mise registry 的短名(mise registry <名字> 查 backend);registry 沒有的寫完整 backend,
# 例如 code-server 只寫 code-server 會模糊比對到不相干的工具。
miseTools:
  eza:
    tool: eza                       # aqua:eza-community/eza
    cmd: eza
    always: true
  fzf:
    tool: fzf                       # aqua:junegunn/fzf
    cmd: fzf
    always: true
  # apt 版的指令叫 batcat
  bat:
    tool: bat                       # aqua:sharkdp/bat
    cmd: bat
    always: true
  ripgrep:
    tool: ripgrep                   # aqua:BurntSushi/ripgrep
    cmd: rg
    always: true
  starship:
    tool: starship                  # aqua:starship/starship
    cmd: starship
    always: true
  btop:
    tool: btop                      # aqua:aristocratos/btop
    cmd: btop
    always: true
  # Ubuntu 24.04 的套件庫沒有 fastfetch
  fastfetch:
    tool: fastfetch                 # aqua:fastfetch-cli/fastfetch
    cmd: fastfetch
    always: true
  ttyd:
    tool: ttyd                      # aqua:tsl0922/ttyd
    cmd: ttyd
    always: true
  vim:
    tool: vim                       # conda:vim
    cmd: vim
  ffmpeg:
    tool: ffmpeg                    # conda:ffmpeg
    cmd: ffmpeg
  # Claude Code 讀 PDF 要 pdftoppm(同 toolPackages 的 poppler-utils)
  claude:
    tool: poppler                   # conda:poppler
    cmd: pdftoppm
  # 有 root 的 Debian 系用 GitHub 的官方 apt 源(install-gh),apt upgrade 會更新
  gh:
    tool: gh                        # aqua:cli/cli
    cmd: gh
  # 有 root 用官方 .deb(install-code-server):docs/code-server-remote.md 的 systemd user unit 靠它
  code-server:
    tool: github:coder/code-server  # registry 沒有
    cmd: code-server
