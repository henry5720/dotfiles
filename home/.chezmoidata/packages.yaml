# 系統套件清單,run_onchange_before_install-packages.sh.tmpl 會讀它。
# 依平台分開列,這份本身就是對照表(同一個工具在兩邊名字不同就各寫各的)。
# 加套件只改這裡;改了之後下一次 chezmoi apply 只會裝缺的那幾個。
packages:
  # Ubuntu(WSL、雲端主機、proot Ubuntu),apt 的套件名
  ubuntu:
    - zsh
    - git
    - curl
    - vim
    - build-essential
    - unzip
    # 下面兩個是 home/ 的 modify_ 與 run_ 腳本自己要用的(jq 改 JSON、python3 改 TOML)。
    # WSL／雲端主機本來就有,但 proot Ubuntu 和最小化映像沒有,沒裝 apply 會在半路失敗。
    - jq
    - python3
  # 原生 Termux,pkg 的套件名
  termux:
    - zsh
    - git
    - curl
    - vim
    - openssh
    - fastfetch
    # 同上,modify_ 要用。Termux 的 python 套件提供 python3 指令。
    - jq
    - python

# 選裝工具(.chezmoi.toml.tmpl 的 tools 選單)裡直接走 apt 的:工具名 → 套件。
# 有勾才裝,跟上面的清單一起由同一支套件腳本處理。
# 要加 apt 來源、curl installer 的工具不放這裡,各自一支 run_onchange_after_install-<工具>.sh.tmpl。
toolPackages:
  ubuntu:
    btop:
      - btop
    # 文件／影音:轉檔、讀 PDF、轉文件格式。python3-venv 給要自己建 venv 的人用
    document-media:
      - ffmpeg
      - mupdf-tools
      - pandoc
      - python3-venv
    # AI 文件解析的 venv 要 python3 -m venv(venv 本身在 run_onchange_after_install-ai-document-media)
    ai-document-media:
      - python3-venv
    # headless Chrome 本體是 .deb(run_onchange_after_install-headless-chrome);
    # 沒這兩個字型,中文和 emoji 截圖全是方框
    headless-chrome:
      - fonts-noto-cjk
      - fonts-noto-color-emoji
